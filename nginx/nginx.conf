# nginx/nginx.conf
#
# Milestone V3 — Nginx Load Balancer for Axum Multi-Instance Cluster
# Downstream workers: 127.0.0.1:8081, 127.0.0.1:8082, 127.0.0.1:8083
#

worker_processes auto;
error_log /tmp/nginx_ecommerce_error.log warn;
pid /tmp/nginx_ecommerce.pid;

events {
    worker_connections 10240;
}

http {
    access_log off; # Disable access log for maximum benchmark throughput

    upstream ecommerce_api_cluster {
        # Least connections routing algorithm
        least_conn;

        # max_fails=0 disables passive host ejection so Nginx never temporarily disables workers
        server 127.0.0.1:8081 max_fails=0;
        server 127.0.0.1:8082 max_fails=0;
        server 127.0.0.1:8083 max_fails=0;

        # HTTP/1.1 persistent keepalive connections to upstream Axum workers
        keepalive 512;
    }

    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://ecommerce_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable proxy buffering for sub-millisecond response pass-through
            proxy_buffering off;
        }
    }
}
