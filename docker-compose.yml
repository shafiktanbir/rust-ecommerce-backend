services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce_lab_db
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "hot_standby=on"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_lab}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-primary-replication.sh:/docker-entrypoint-initdb.d/init-primary-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce_lab}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres_replica:
    image: postgres:15-alpine
    container_name: ecommerce_lab_db_replica
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_lab}
    ports:
      - "${POSTGRES_REPLICA_PORT:-5435}:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./scripts/start-replica.sh:/start-replica.sh:ro
    entrypoint: ["/start-replica.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce_lab}"]
      interval: 3s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecommerce_lab_redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── Milestone V3: Axum API Workers ──────────────────────────────────────────
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_lab_api1
    ports:
      - "8081:8081"
    environment:
      APP_PORT: "8081"
      APP_ENV: "development"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_secret}@postgres:5432/${POSTGRES_DB:-ecommerce_lab}"
      READ_DATABASE_URL: "postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_secret}@postgres_replica:5432/${POSTGRES_DB:-ecommerce_lab}"
      REDIS_URL: "redis://redis:6379"
      RUST_LOG: "ecommerce_lab=info,tower_http=warn"
      JWT_SECRET: "supersecret_jwt_key_ecommerce_lab_2026"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_lab_api2
    ports:
      - "8082:8082"
    environment:
      APP_PORT: "8082"
      APP_ENV: "development"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_secret}@postgres:5432/${POSTGRES_DB:-ecommerce_lab}"
      READ_DATABASE_URL: "postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_secret}@postgres_replica:5432/${POSTGRES_DB:-ecommerce_lab}"
      REDIS_URL: "redis://redis:6379"
      RUST_LOG: "ecommerce_lab=info,tower_http=warn"
      JWT_SECRET: "supersecret_jwt_key_ecommerce_lab_2026"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_lab_api3
    ports:
      - "8083:8083"
    environment:
      APP_PORT: "8083"
      APP_ENV: "development"
      DATABASE_URL: "postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_secret}@postgres:5432/${POSTGRES_DB:-ecommerce_lab}"
      READ_DATABASE_URL: "postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce_secret}@postgres_replica:5432/${POSTGRES_DB:-ecommerce_lab}"
      REDIS_URL: "redis://redis:6379"
      RUST_LOG: "ecommerce_lab=info,tower_http=warn"
      JWT_SECRET: "supersecret_jwt_key_ecommerce_lab_2026"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Milestone V3: Nginx Load Balancer ─────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce_lab_nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  postgres_replica_data:
    driver: local
